server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 500
      min-spare: 50
    accept-count: 1000

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: nivora

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 80
      max-lifetime: 1800000
      minimum-idle: 20
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        default_batch_fetch_size: 20

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID_GG}
            client-secret: ${CLIENT_SECRET_GG}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent
            token-uri: https://oauth2.googleapis.com/token
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-name-attribute: sub
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

cloudinary:
  cloud-name: ${CLOUD_NAME}
  api-key: ${CLOUD_API_KEY}
  api-secret: ${CLOUD_API_SECRET}

app:
  frontend-url: ${FRONTEND_URL}
  backend-url: ${BACKEND_URL}
  fastapi-url: ${FASTAPI_URL:http://127.0.0.1:8000}
  cache:
    search-ttl-minutes: 60
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:product.exchange}
    queue: ${RABBITMQ_QUEUE:product.indexing.queue}
    routing-key: ${RABBITMQ_ROUTING_KEY:product.indexing}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.ecommerce.nivora: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
